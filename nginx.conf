server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The application is a single-page site; return its pre-rendered entry
    # point for paths that do not map to a static file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints built assets, so they can be cached indefinitely.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
